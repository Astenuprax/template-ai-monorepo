# Mirrors the local pre-commit gate (the hook is bypassable with --no-verify; CI is not).
# All actions are pinned to a full commit SHA (supply-chain mandate; enforced by
# tests/test_structure.py::test_all_workflow_actions_are_sha_pinned).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Sync workspace
        run: uv sync --all-packages --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (pyright strict)
        run: uv run pyright
      - name: Test (excluding integration)
        run: uv run pytest -m "not integration"
      - name: Integration round-trip (stdio MCP)
        if: matrix.python == '3.12'
        run: uv run pytest -m integration

  gate:
    name: gate (pre-commit / gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages --frozen
      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: sbom (cyclonedx)
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages --frozen
      - name: Generate CycloneDX SBOM
        run: >
          uv run --with cyclonedx-bom
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  # Dependency CVE gate. Scans the committed uv.lock directly (the exact resolved set,
  # install-independent) with OSV-Scanner — the OpenSSF-ecosystem scanner, coherent with this
  # repo's Scorecard + SLSA + SBOM supply-chain posture, and native to uv.lock. Engine +
  # invocation verified green locally (osv-scanner v2.3.8, `--lockfile=uv.lock`: 0 issues).
  osv-scan:
    name: osv-scan (uv.lock)
    needs: check
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --lockfile=uv.lock

  # GitHub-Actions workflow linter.
  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          fail_level: error
